name: Fast tests and installation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip install --no-build-isolation .
      - run: cd /tmp && python -c "from options_engine import bsm_price, simulate_delta_hedge; assert abs(bsm_price(100,100,1,.05,.2)-10.450583572185565)<1e-11"
      - run: python -m pytest -m "not slow" -q
      - run: python scripts/check_docs.py

name: Slow numerical validation
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements/visualization-py312.txt
      - run: python -m pip install --no-build-isolation .
      - run: python -m pytest -m slow -q
      - run: python examples/reproduce.py --mode full --output work/ci-results
      - run: python scripts/verify_results.py work/ci-results
      - run: python scripts/check_report_tables.py work/ci-results
      - uses: actions/upload-artifact@v4
        with:
          name: numerical-results
          path: work/ci-results

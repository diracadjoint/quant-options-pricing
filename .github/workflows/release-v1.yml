name: Validate and publish v1.0.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-v1.0.0
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'diracadjoint/quant-options-pricing' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements/visualization-py312.txt
      - run: python -m pip install --no-build-isolation .
      - name: Check installed version outside the checkout
        run: |
          cd /tmp
          python -c "from importlib.metadata import version; from options_engine import bsm_price; assert version('options-engine') == '1.0.0'; assert abs(bsm_price(100,100,1,.05,.2)-10.450583572185565)<1e-11"
      - name: Full tests and preserved results
        run: |
          mkdir -p work
          python -m pytest -q | tee work/release-tests.txt
          python scripts/check_docs.py
          python scripts/verify_results.py docs/generated
          python scripts/check_report_tables.py docs/generated
      - name: Reproduce separately from historical artifacts
        run: |
          python examples/reproduce.py --mode full --output work/release-results
          python scripts/verify_results.py work/release-results
          python scripts/check_report_tables.py work/release-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1.0.0-validation
          path: |
            work/release-tests.txt
            work/release-results
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/dev.txt
      - run: python -m pip wheel --no-index --no-deps --no-build-isolation --wheel-dir work/dist .
      - name: Create immutable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh api "repos/$RELEASE_REPO/git/ref/tags/v1.0.0" > work/tag.json 2> work/tag-error.txt; then
            python -c "import json,os; assert json.load(open('work/tag.json'))['object']['sha'] == os.environ['RELEASE_SHA'], 'Existing tag points to another commit; refusing to move it'"
          else
            gh api --method POST "repos/$RELEASE_REPO/git/refs" -f ref=refs/tags/v1.0.0 -f "sha=$RELEASE_SHA"
          fi
          gh release create v1.0.0 --repo "$RELEASE_REPO" --verify-tag --latest \
            --title "Options Pricing and Risk Engine v1.0.0" \
            --notes-file docs/release_notes_v1.0.0.md \
            work/dist/options_engine-1.0.0-py3-none-any.whl \
            docs/technical_report.pdf docs/technical_report.md docs/zenodo_metadata.json
